name: InsideTheGame CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Verifier v5.2 & Regression Unit Suite (21 Tests)
        run: |
          pytest test_verifier.py -v
          python3 test_verifier.py

      - name: Generate Seed 42 Match Telemetry & Verify Ground Truth
        run: |
          python3 generator.py --seed 42
          python3 -c "import json; gt=json.load(open('ground_truth.json')); assert gt['true_minute']==52 and gt['end_minute']==64"
