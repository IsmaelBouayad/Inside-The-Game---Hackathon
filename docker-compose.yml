services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  control-room-ui:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env.example
    depends_on:
      - ollama

  match-engine:
    build: .
    command: ["python3", "engine.py", "--start-minute", "48"]
    env_file:
      - .env.example
    depends_on:
      - ollama
      - control-room-ui

volumes:
  ollama_data:
